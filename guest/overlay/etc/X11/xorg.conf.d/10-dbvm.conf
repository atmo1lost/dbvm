# v86 has a Bochs VBE adapter and no GPU: drive the bochs-drm framebuffer
# (/dev/fb0) with the fbdev driver and a shadow buffer, no GL.

Section "ServerFlags"
	Option "AutoAddGPU" "off"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

Section "Device"
	Identifier "v86-vga"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
	Option "ShadowFB" "on"
EndSection

Section "Screen"
	Identifier "screen0"
	Device "v86-vga"
	DefaultDepth 24
EndSection

Section "Module"
	Disable "glx"
EndSection
