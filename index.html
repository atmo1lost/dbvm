<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dbvm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <span class="brand">dbvm</span>
      <span id="profile" class="muted"></span>
      <span id="status">loading…</span>
      <span class="spacer"></span>
      <nav class="tabs">
        <button data-view="screen" class="active">Screen</button>
        <button data-view="serial">Serial</button>
      </nav>
      <button id="btn-save" disabled title="Save the running machine to this browser">Save session</button>
      <button id="btn-reset" disabled title="Discard the saved session">Reset</button>
      <button id="btn-restart" disabled>Restart</button>
      <button id="btn-fullscreen" disabled>Fullscreen</button>
    </header>
    <main>
      <div id="screen">
        <div class="text-screen"></div>
        <canvas class="gfx-screen"></canvas>
      </div>
      <div id="serial" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
