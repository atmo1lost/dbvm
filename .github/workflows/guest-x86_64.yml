# Builds the 64-bit (QEMU) guest: Alpine x86_64 with the dbvm desktop and
# Flatpak. Kernel, initramfs and an ext4 disk image. mkdisk needs Linux + root,
# so this runs in CI. Fetch with tools/fetch-qemu-artifacts.sh.

name: guest-x86_64

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/mkimage.py"
      - "tools/mkdisk.sh"
      - "guest/**"
      - ".github/workflows/guest-x86_64.yml"

jobs:
  disk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DBVM_CACHE: ${{ github.workspace }}/_dbvm
    steps:
      - uses: actions/checkout@v4

      - name: Build the x86_64 rootfs, kernel and initramfs
        run: python3 -I tools/mkimage.py --arch x86_64

      - name: Make the ext4 disk image
        run: |
          sudo sh tools/mkdisk.sh "$DBVM_CACHE/build/rootfs-x86_64.tar" "$DBVM_CACHE/images/alpine64/disk.img" 1G
          date +%s > "$DBVM_CACHE/images/alpine64/version"
          ls -la "$DBVM_CACHE/images/alpine64"

      - uses: actions/upload-artifact@v4
        with:
          name: alpine64
          path: _dbvm/images/alpine64/
          retention-days: 30
